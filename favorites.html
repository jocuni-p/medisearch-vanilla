<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Joan Cuní" />
        <meta
            name="description"
            content="Tus medicamentos guardados en MediSearch. Accede rápidamente a la ficha de los que consultas con frecuencia."
        />
        <title>Favoritos - Medisearch</title>

		<!-- ======= FAVICON ======= -->
		<link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
		<link rel="shortcut icon" href="favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
		<link rel="manifest" href="favicon/site.webmanifest" />

        <!-- ======= FUENTE ======= -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <!-- ====== ESTILOS ====== -->
        <link rel="stylesheet" href="css/style.css" />
        <!-- CDN BOOTSTRAP PARA ICONS-->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <!-- ======= JAVASCRIPT =======-->
        <script src="js/controllers/favorites.controller.js" type="module"></script>
    </head>
    <body>
        <noscript>
            <div class="alert-js">
                <p>⚠️ JavaScript Desactivado</p>
                <p>Activa JavaScript en tu navegador para disfrutar de una experiencia completa.</p>
            </div>
        </noscript>

        <header id="app-header"></header>

        <main>
            <h1>Mis favoritos</h1>
            <p class="favorites-subtitle">Medicamentos guardados para consulta rápida.</p>

            <!-- SPINNER DE LOADING -->
            <div id="spinner" class="spinner hidden" aria-hidden="true">
                <i class="bi bi-arrow-clockwise spin"></i>
            </div>

            <!-- ERROR MSG Y STATUS (módulo ui-state)-->
            <div id="state-message" class="state-message hidden" role="status" aria-live="polite"></div>

            <!-- LISTA DE FAVORITOS -->
            <div>
                <ul id="favorites-list"></ul>
            </div>
        </main>

        <footer id="app-footer"></footer>
    </body>
</html>
