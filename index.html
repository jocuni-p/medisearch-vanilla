<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Joan Cuní" />
        <meta
            name="description"
            content="Web Multipágina clásica. Proyecto final del Curso de Desarrollo Web Frontend IFCD55 2026"
        />
        <title>Buscador de medicamentos</title>

        <!-- ======= FUENTE ======= -->
        <!-- Si pongo aquí la fuente importada la descarga antes o en paralelo de los css-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <!-- ====== ESTILOS ====== -->
        <link rel="stylesheet" href="css/style.css" />

        <!-- CDN BOOTSTRAP ICONS-->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />

        <!-- ======= JAVASCRIPT =======-->
        <script src="js/controllers/main.controller.js" type="module"></script>

        <!-- Mas adelante, crear un favicon en favicon.io 
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>" />  -->
    </head>
    <body>
        <!-- xxxxxxxxxx OJO: crear selector css con estilo para el noscript-->
        <noscript>
            <div class="alerta-js">
                <p>⚠️ JavaScript Desactivado</p>
                <p>Activa JavaScript en tu navegador para disfrutar de una experiencia completa.</p>
            </div>
        </noscript>

        <!--- ===================== HEADER =============================-->
        <header id="app-header"></header>

        <main>
            <!--========== VISTA PRINCIPAL ==========-->
            <h1>Buscador de medicamentos</h1>
            <p class="subtitle">
                Busca por nombre comercial y consulta fichas, prospectos y problemas de suministro.
            </p>

            <form id="form">
                <!-- El label es para los lectores de pantalla cuando encuentren el campo d e edición. Poner el elemento visualmente oculto con el css. La clase visually-hidden lo deja solo visible justo para eso.-->
                <label for="search-input" class="visually-hidden">Buscar medicamentos</label>
                <input
                    id="search-input"
                    type="search"
                    name="nombre"
                    placeholder="Nombre comercial (ej. Couldina, Nolotil...)"
                />
                <button type="submit">Buscar</button>
            </form>

            <!-- SPINNER de loading -->
            <div id="spinner" class="spinner hidden" aria-hidden="true">
                <i class="bi bi-arrow-clockwise spin"></i>
            </div>

            <!-- CONTAINER PARA MENSAJES DE ERROR Y STATUS (manejado por módulo ui-state)-->
            <div id="state-message" class="state-message hidden" role="status" aria-live="polite">
                xxxxxxxxxxxxxxxxxxxxx
            </div>

            <!--div class="hidden" envuelve todas las cards-->

            <!-- ========= LISTA DE CARDS ========== -->
            <p id="results-info" class="top-info-pagination">RESULTADOS _ de _</p>
            <ul id="results-list"></ul>
            <!---</div>-->
            <nav id="pagination" aria-label="Paginación">&lt;&lt; 1 de 5 &gt;&gt;</nav>

            <small class="legal">
                Datos:
                <a href="https://cima.aemps.es" target="_blank" rel="noopener">CIMA</a>
                ·
                <a href="aviso-legal.html">Aviso legal</a>
            </small>
        </main>

        <!-- ========= SE OCULTA EN EL NAVEGADOR ========== -->
        <template id="template-medicine">
            <li class="li-main">
                <!-- Pendiente ruta a la pagina detalle de la card-->
                <a href="xxxxxxxxxxxxxxxx">
                    <!-------------------------------------------------->
                    <div class="li-top-block">
                        <h2>ERROR DE SERVIDOR</h2>
                        <!--------------------------------------------------->
                        <div class="li-mid-block">
                            <p class="li-subtitle"></p>
                            <!-- Lo dejo vacío por si hubiese error de servidor-->
                            <span class="arrow" aria-hidden="true"
                                ><i class="bi bi-chevron-compact-right"></i
                            ></span>
                        </div>
                    </div>
                    <!--------------------------------------------------->
                    <div class="li-bottom-block">
                        <span class="li-tag tag-recipe"><i class="bi bi-file-medical"></i>Receta</span>
                        <span class="li-tag tag-hospital"><i class="bi bi-h-square"></i>Hospitalario</span>
                        <span class="li-tag tag-generic"><i class="bi bi-copy"></i>Genérico</span>
                        <span class="li-tag tag-psum"
                            ><i class="bi bi-exclamation-triangle"></i>Suministro</span
                        >
                    </div>
                </a>
            </li>
        </template>
    </body>
</html>
