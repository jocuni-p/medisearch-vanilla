<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />

        <title>Buscador de medicamentos</title>
        <link rel="stylesheet" href="css/style.css" />

        <!-- Mas adelante, crear un favicon en favicon.io

    <body>
        <!-- xxxxxxxxxx OJO: crear selector css con estilo para el noscript-->
        <noscript>
            <div class="alerta-js">
                <h2>⚠️ JavaScript Desactivado</h2>
                <p>Activa JavaScript en tu navegador para disfrutar de una experiencia completa.</p>
            </div>
        </noscript>

        <!--- ===================== HEADER =============================-->
        <header id="app-header"></header>

        <main>
            <!--========== VISTA PRINCIPAL ==========-->
            <h1>Buscador de medicamentos</h1>
            <p class="subtitle">Consulta fichas, prospectos y problemas de suministro</p>
			
            <small class="legal">
                Datos:
                <a href="https://cima.aemps.es" target="_blank" rel="noopener">CIMA</a>
                ·
                <a href="aviso-legal.html">Aviso legal</a>
            </small>

            <form>
                <!-- El label es para los lectores de pantalla cuando encuentren el campo d e edición. Poner el elemento visualmente oculto con el css. La clase visually-hidden lo deja solo visible justo para eso.-->
                <label for="search-input" class="visually-hidden">Buscar medicamento</label>
                <input id="search-input" type="search" name="nombre" />
                <button type="submit">Buscar</button>
            </form>

            <section id="results-list">Aquí la lista de cards que la capa view (o js) rellenará</section>
            <nav id="pagination" aria-label="Paginación">1 de 3</nav>
        </main>
        <!--========== TEMPLATES ==========-->
    </body>
