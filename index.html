<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Joan Cuní" />
        <meta
            name="description"
            content="Consulta rápida de medicamentos comercializados en España: principio activo, receta, problemas de suministro y prospecto oficial. Datos de la AEMPS."
        />
        <title>MediSearch - Buscador de medicamentos</title>

		 <!-- ======= FAVICON ======= -->
		<link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
		<link rel="shortcut icon" href="favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
		<link rel="manifest" href="favicon/site.webmanifest" />

        <!-- ======= FUENTE ======= -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <!-- ====== ESTILOS ====== -->
        <link rel="stylesheet" href="css/style.css" />
        <!-- CDN BOOTSTRAP ICONS-->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <!-- ======= JAVASCRIPT =======-->
        <script src="js/controllers/main.controller.js" type="module"></script>
    </head>
    <body>
        <noscript>
            <div class="alert-js">
                <p>⚠️ JavaScript Desactivado</p>
                <p>Activa JavaScript en tu navegador para disfrutar de una experiencia completa.</p>
            </div>
        </noscript>

        <header id="app-header"></header>

        <main>
            <h1>Buscador de medicamentos</h1>
            <form id="form">
                <!-- El label es para los lectores de pantalla cuando encuentren el campo de edición. La clase visually-hidden lo deja solo visible justo para eso.-->
                <div class="search-row">
                    <label for="search-input" class="visually-hidden">Buscar medicamentos</label>
                    <input
                        id="search-input"
                        type="search"
                        name="nombre"
                        placeholder="Nombre comercial (ej. Gelocatil)"
                        aria-describedby="form-validation-msg"
                    />
                    <button type="submit">Buscar</button>
                </div>

                <!--MENSAJE DE VALIDACION DEL INPUT-->
                <p id="form-validation-msg" class="form-validation-msg hidden" role="alert"></p>
            </form>

            <!-- SPINNER -->
            <div id="spinner" class="spinner hidden" aria-hidden="true">
                <i class="bi bi-arrow-clockwise spin"></i>
            </div>

            <!-- ERROR MSG & STATUS (módulo ui-state)-->
            <div id="state-message" class="state-message hidden" role="status" aria-live="polite"></div>

            <!-- MENSAJE INICIAL DE PRESENTACIÓN   lo gestionará ui-state.view-->
            <div id="initial-text" class="initial-text">
                <h2>Escribe el nombre de un medicamento</h2>

                <p class="initial-text-lead">
                    Encontrarás su principio activo, si necesita receta, si hay problemas de suministro y un enlace al prospecto oficial de la AEMPS.
                </p>
                <p class="initial-text-note">
                    Solo se muestran medicamentos actualmente comercializados en España.
                </p>
            </div>

            <!--  CARDS LIST --- -->
            <ul id="results-list"></ul>
        </main>
        <footer id="app-footer"></footer>

        <template id="template-medicine">
            <li class="li-main">
                <a href="">
                    <div class="li-top-block">
                        <h2></h2>

                        <div class="li-mid-block">
                            <p class="li-subtitle"></p>

                            <span class="arrow" aria-hidden="true"
                                ><i class="bi bi-chevron-compact-right"></i
                            ></span>
                        </div>
                    </div>

                    <div class="li-bottom-block"></div>
                </a>
            </li>
        </template>
    </body>
</html>
