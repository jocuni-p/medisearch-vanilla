<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Joan Cuní" />
        <meta
            name="description"
            content="Web Multipágina clásica. Proyecto final del Curso de Desarrollo Web Frontend IFCD55 2026"
        />
        <title>Medisearch - Buscador de medicamentos</title>
        <!-- ======= FUENTE ======= -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <!-- ====== ESTILOS ====== -->
        <link rel="stylesheet" href="css/style.css" />
        <!-- CDN BOOTSTRAP ICONS-->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <!-- ======= JAVASCRIPT =======-->
        <script src="js/controllers/main.controller.js" type="module"></script>
    </head>
    <body>
        <noscript>
            <div class="alert-js">
                <p>⚠️ JavaScript Desactivado</p>
                <p>Activa JavaScript en tu navegador para disfrutar de una experiencia completa.</p>
            </div>
        </noscript>

        <header id="app-header"></header>

        <main>
            <h1>Buscador de medicamentos</h1>
            <p class="subtitle">
                Busca por nombre comercial y consulta fichas, prospectos y problemas de suministro.
            </p>

            <form id="form">
                <!-- El label es para los lectores de pantalla cuando encuentren el campo d e edición. Poner el elemento visualmente oculto con el css. La clase visually-hidden lo deja solo visible justo para eso.-->
                <label for="search-input" class="visually-hidden">Buscar medicamentos</label>
                <input
                    id="search-input"
                    type="search"
                    name="nombre"
                    placeholder="Nombre comercial (ej. Couldina, Nolotil...)"
                />
                <button type="submit">Buscar</button>
            </form>

            <!-- SPINNER -->
            <div id="spinner" class="spinner hidden" aria-hidden="true">
                <i class="bi bi-arrow-clockwise spin"></i>
            </div>

            <!-- ERROR MSG & STATUS (módulo ui-state)-->
            <div id="state-message" class="state-message hidden" role="status" aria-live="polite"></div>

            <!-- TODO: Linea futura de desarrollo. Paginación
            <p id="results-info" class="top-info-pagination">RESULTADOS _ DE _</p> -->

            <!--  CARDS LIST --- -->
            <ul id="results-list"></ul>

            <!-- TODO: Linea futtura de desarrollo. Paginación 
            <nav id="pagination" aria-label="Paginación">&lt;&lt; 1 de 5 &gt;&gt;</nav> -->
        </main>
        <footer id="app-footer"></footer>

        <template id="template-medicine">
            <li class="li-main">
                <a href="">
                    <div class="li-top-block">
                        <h2></h2>

                        <div class="li-mid-block">
                            <p class="li-subtitle"></p>

                            <span class="arrow" aria-hidden="true"
                                ><i class="bi bi-chevron-compact-right"></i
                            ></span>
                        </div>
                    </div>

                    <div class="li-bottom-block"></div>
                </a>
            </li>
        </template>
    </body>
</html>
