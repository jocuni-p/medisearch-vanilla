<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Joan Cuní" />
        <meta
            name="description"
            content="Ficha completa de un medicamento: principio activo, laboratorio, si necesita receta, problemas de suministro, notas de seguridad y enlace al prospecto oficial de la AEMPS."
        />
        <title>Detalle - Medisearch</title>

		<link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
		<link rel="shortcut icon" href="favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
		<link rel="manifest" href="favicon/site.webmanifest" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <script src="js/controllers/detail.controller.js" type="module"></script>
    </head>

    <body>
        <noscript>
            <div class="alert-js">
                <p>⚠️ JavaScript Desactivado</p>
                <p>Activa JavaScript en tu navegador para disfrutar de una experiencia completa.</p>
            </div>
        </noscript>

        <header id="app-header"></header>

        <main class="main-detail">
            <div class="detail-card">
                <!-- ESTADO  -->
                <div id="spinner" class="spinner hidden" aria-hidden="true">
                    <i class="bi bi-arrow-clockwise spin"></i>
                </div>

                <!-- ERROR MSG Y STATUS (manejo por ui-state)-->
                <div id="state-message" class="state-message hidden" role="status" aria-live="polite"></div>

                <!-- CONTENT BLOCKS -->
                <section id="medication-identity"></section>
                <section id="medication-notes" class="hidden"></section>
                <section id="medication-supply" class="hidden"></section>
                <section id="medication-docs"></section>
                <section id="medication-fav-action"></section>
            </div>
        </main>

        <footer id="app-footer"></footer>
    </body>
</html>
