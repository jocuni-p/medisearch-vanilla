<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Joan Cuní" />
        <meta
            name="description"
            content="Web Multipágina clásica. Proyecto final del Curso de Desarrollo Web Frontend IFCD55 2026"
        />
        <title>Detalle - Medisearch</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <script src="js/controllers/detail.controller.js" type="module"></script>
    </head>

    <body>
        <!-- TODO: crear selector css con estilo para el noscript-->
        <noscript>
            <div class="alert-js">
                <p>⚠️ JavaScript Desactivado</p>
                <p>Activa JavaScript en tu navegador para disfrutar de una experiencia completa.</p>
            </div>
        </noscript>

        <!--- ===================== HEADER =============================-->
        <header id="app-header"></header>

        <main>
            <div class="detail-card">
                <!-- ESTADO GLOBAL -->
                <div id="spinner" class="spinner hidden" aria-hidden="true">
                    <i class="bi bi-arrow-clockwise spin"></i>
                </div>

                <!-- MENSAJES DE ERROR Y STATUS (manejo por ui-state)-->
                <div id="state-message" class="state-message hidden" role="status" aria-live="polite"></div>

                <!--======== CONTENT BLOCKS ========-->
                <section id="medication-identity">
                    <!-- JS pintará h1, p subtitulo(vtm), lab, tags con .li-tag-->
                </section>

                <section id="medication-docs">
                    <!-- JS pintará boton/enlace 'Ver prospecto'-->
                </section>

                <section id="medication-supply" class="hidden">
                    <!-- condicional:título + dos fechas | skeleton | error -->
                </section>

                <section id="medication-notes" class="hidden">
                    <!-- condicional: título + string | skeleton | error -->
                </section>

                <section id="medication-fav-action">
                    <button id="btn-fav">
					</button>
                    <!-- dispara una acción (UI + localStorage), No navega a favoritos-->
                </section>
            </div>

            <small class="legal">
                <a href="legal-policy.html">Aviso legal</a>
            </small>
        </main>
    </body>
</html>
